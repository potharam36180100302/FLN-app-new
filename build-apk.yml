name: Build FLN Android APK / AAB

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Build offline web files
        run: npm run prepare-web

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash
        run: npm run assets

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Set version number and show SDK levels
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle || true
          grep -nE "minSdk|compileSdk|targetSdk" android/variables.gradle || true

      - name: Build debug APK (for testing)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FLN-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build and sign release APK + AAB (only if keystore secrets are set)
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android
          ./gradlew assembleRelease bundleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p ../out
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../out/aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out ../out/FLN-release.apk ../out/aligned.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/FLN-release.aab
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" ../out/FLN-release.aab "$KEY_ALIAS"
          rm ../out/aligned.apk

      - uses: actions/upload-artifact@v4
        if: ${{ env.KS_B64 != '' }}
        with:
          name: FLN-release-apk-aab
          path: out/*
