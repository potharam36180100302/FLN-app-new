<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FLN based learning app</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+Telugu:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#14224a;--bg2:#3a1d5c;--bg3:#0b4a4a;--tx:#fff6c9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16294a;--bg2:#2b2a4a;--bg3:#173a3a;--tx:#fff6c9}}
:root[data-theme="dark"]{--bg1:#16294a;--bg2:#2b2a4a;--bg3:#173a3a;--tx:#fff6c9}
html{font-size:20px}@media (max-width:480px){html{font-size:18px}}.hs{scrollbar-width:thin;scrollbar-color:#ffd54a transparent;-webkit-overflow-scrolling:touch}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#14224a}html,body{margin:0;min-height:100%}
body{font-family:'Baloo 2','Noto Sans Telugu','Comic Sans MS',system-ui,sans-serif;background:radial-gradient(circle at 12% 8%,#ff4fa366,transparent 38%),radial-gradient(circle at 90% 18%,#ffd54a55,transparent 38%),radial-gradient(circle at 50% 95%,#2ee6a655,transparent 45%),radial-gradient(circle at 5% 70%,#4cc3ff55,transparent 35%),linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--tx);background-attachment:fixed}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 12px 2px #ffd54a,0 8px 0 #e0a100;transform:scale(1)}50%{box-shadow:0 0 38px 14px #ffe58a,0 8px 0 #e0a100;transform:scale(1.07)}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(6deg)}}
.rb{border:8px solid transparent;border-radius:2rem;background:linear-gradient(var(--c,#fff),var(--c,#fff)) padding-box,repeating-linear-gradient(45deg,#ff8fab 0 14px,#ffd54a 14px 28px,#7ad9a8 28px 42px,#7cc4ff 42px 56px) border-box}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
button:focus-visible{outline:4px solid #1e3a5f;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>

ిలోని అక్షరములతో వీలైనన్ని పదాలు తయారు చేయుము?","ఒక పట్టికలోని పదాలను తప్పులు లేకుండా వేగంగా చదువుము?","క, త, న, మ, ర అక్షరాలు లేకుండా ఒక వాక్యనిర్మాణం చేయుము?","పదంలో రెండవ అక్షరం ‘తా’ వచ్చేలా పది పదాలు రాయుము?","అక్షరాలను క్రమంలో ఉంచి పదాలను సరి చేయుము? (తారమ) తామర"]]]},{"t":"ఉన్నమాట!","e":"మాట","p":[["s","",["ఆచరణే అసలైన పొగడ్త.","ఒకరి తెలివి తక్కువతనం మరొకరికి అదృష్టం అవుతుంది.","విలువైన కాలాన్ని వృధా చేయకూడదు.","తప్పుని ఒప్పుకోకపోవడం మరోతప్పు అవుతుంది.","ఖాళీగా ఉన్నవారి బుర్ర చెడుఆలోచనలకు నిలయం.","ముందు కష్టాలు ఎదురైన తరువాత విజయం వరిస్తుంది.","ఆనందానికి మూలం అణకువ.","మంచిని ఆశించాలి కాని, దేనికైనా సిద్ధంగా ఉండాలి.","ఒకరికొకరు సాయం చేసుకోవడం అవసరం.","కోటివిద్యలు కూటికోసమే.","లాభంలేని పనిచేసేకన్న ఖాళీగా ఉండడం మేలు.","కోరికలు ఆలశ్యమయ్యేకొద్ది మరింత దృఢమౌతాయి.","తృప్తి విందుతో సమానం.","ఒకసారి మోసం చేస్తే అస్తమానం అనుమానిస్తూనే ఉంటారు.","ఒక్కచర్య వల్లనే మనిషి పిచ్చివాడని నిర్ణయించకూడదు.","మనం కోరుకున్నవాటిని త్వరగా నమ్ముతాం.","అతిజాగ్రత్త అంత మంచిది కాదు.","కష్టపడేవారికి తప్పకుండా ఫలితం దక్కుతుంది.","పుండు మానినా మచ్చమిగిలిపోతుంది.","రోగం వచ్చినపుడుగానీ తెలియదు ఆరోగ్యం విలువ.","కష్టపడకుండా ఫలితం దక్కదు.","చెడ్డవారితో స్నేహం చేస్తే వారి అలవాట్లే వస్తాయి.","ఎవరూ అన్ని వేళలా తెలివిగా ఉండరు.","ప్రమాదాన్ని ముందుగా పసిగడితే సగం అనర్థాన్ని నివారించినట్లే.","గడిచిన కాలాన్ని తిరిగి పొందలేము.","సలహాలిచ్చినంత ఉదారంగా సాయం చెయ్యలేరు.","జ్ఞానమే శక్తి."]],["s","",["మంచివాళ్ళెప్పుడూ అకస్మాత్తుగా ధనవంతులు కారు.","తక్కువ తెలిసినవాళ్ళు పదేపదే దాన్నే చెబుతుంటారు.","పేదవారికి సాయం చేస్తే మరింత సంపద వస్తుంది.","బతకడంలో లేదు జీవితం, ఇష్టపడడంలోనే ఉంది.","సాయంకన్నా మాట ఎక్కువ బాధిస్తుంది.","చెడు వార్త చాలా త్వరగా వ్యాపిస్తుంది.","బహుమతులతో దయాగుణాన్ని పొందలేం.","మంచిలేని చోటంతా చెడే.","ఎవరి ఇల్లు వారికి గొప్ప.","ఏదైనా పనిచేసే ముందే బాగా ఆలోచించాలి.","సంఘానికి దూరంగా ఎవరూ ఒంటరి జీవితం గడపలేరు.","కొన్నిసార్లు ఒకరి మంచి మరొకరికి చెడు అవ్వచ్చు.","అన్యాయాన్ని ఆశ్రయించినవాళ్ళే పగని, ద్వేషాన్ని పెంచుకుంటారు.","పొదుపు చేసేచోట ఖర్చుచేయకు, ఖర్చుపెట్టాల్సిన దగ్గర దాచకు","పేదరికాన్ని పొగడడం సులువే కా వాటికి పేర్లు ఇవ్వలేదు)","తెలుగు లిపి ఇతర భారతీయ భాషా లిపులలాగే ప్రాచీన దక్షిణ బ్రాహ్మీ లిపినుండి ఉద్భవించింది. అశోకుని కాలంలో మౌర్య సామ్రాజ్యానికి సామంతులుగా ఉన్న శాతవాహనులు బ్రాహ్మీ లిపిని దక్షిణ భారతదేశానికి తీసుకొని వచ్చారు. అందుచేత అన్ని దక్షిణ భారత భాషలు మూలద్రావిడ భాష నుండి ఉద్భవించినా వాటి లిపులు మాత్రము బ్రాహ్మీ నుండి పుట్టాయి. దక్షిణ భారతదేశములో బ్రాహ్మీ లిపిలో వ్రాసిన అక్షరములు మొదట భట్టిప్రోలులో దొరికాయి. అచట బౌద్ధస్థూపములో దొరికిన ధాతుకరండముపై మౌర్యకాలపు బ్రాహ్మీ లిపిని పోలిన లిపిలో అక్షరాలున్నాయి. ఈ లిపిని భాషాకారులు భట్టిప్రోలు లిపి అంటారు. దక్షిణ భారతదేశ లిపులన్నియూ ఈ లిపినుండే పరిణామము చెందాయి.","ఆంధ్రప్రదేశ్ మరియు తెలంగాణ రాష్ట్రాలు అధికార భాష తెలుగు, భారతదేశంలో మాతృభాషగా మాట్లాడే 8.1 కోట్ల (2011) జనాభాతో ప్రాంతీయభాషలలో మొదటి స్థానంలో ఉంది. ప్రపంచంలోని ప్రజలు అత్యధికముగా మాట్లాడే భాషలలో 18వ స్థానములోనూ, భారత దేశములో 3వ స్థానములోనూ నిలుస్తుంది. పాతవైన ప్రపంచ భాష గణాంకాల (ఎథ్నోలాగ్) ప్రకారం ప్రపంచవ్యాప్తంగా 7.4 కోట్లు మందికి మాతృభాషగా ఉంది మరియు మొదటి భాషగానూ మాట్లాడతారు. అతి ప్రాచీన దేశ భాషలలో సంస్కృతము తమిళముతో బాటు తెలుగు భాషను 2008 అక్టోబరు 31న భారత ప్రభుత్వము గుర్తించింది.","వెనీసుకు చెందిన వర్తకుడు నికోలో దా కాంటి భారతదేశం గుండా ప్రయాణిస్తూ, తెలుగు భాషలోని పదములు ఇటాలియన్ భాషవలె అజంతాలు (అచ్చు అంతమున కలిగి)గా ఉండటం గమనించి తెలుగును ఇటాలియన్ ఆఫ్ ది ఈస్ట్ గా కొనియాడారు. కన్నడిగుడైన శ్రీకృష్ణదేవరాయలు తెలుగు భాషను ‘దేశ భాషలందు తెలుగు లెస్స’ అని కీర్తించారు. తెలుగు అక్షరమాల కన్నడ భాష లిపిని పోలియుంటుంది.","పలక – తెలుగు పదమాలిక చిరునామా: బొల్లినేని సోమసుందరరావు, సర్వేరెడ్డిపాలెం గ్రామం, ఒంగోలు మండలం, ప్రకాశం జిల్లా – 523272, ఆంధ్రప్రదేశ్. (RAJ DTP ONGOLE – 9885888793)"]]]},{"t":"సూక్తులు (మంచి మాటలు)","e":"సూక్తి","p":[["s","",["క్షమించడం వివేకవంతుల లక్షణం. – గాంధీజీ.","విజ్ఞానంతోపాటు సంస్కారాన్ని కూడా కలిగినవారిని సమాజం గౌరవిస్తుంది. – సర్వేపల్లి రాధాకృష్ణన్.","మితిమీరిన విశ్రాంతి అన్నివిధాలా అనర్థమే. – నెహ్రూ.","ఉత్తములు ఎదుటివారిలోని మంచితనాన్నే చూస్తారు. – గౌతమబుద్ధుడు.","దురలవాట్లను విషంలా భావించి వాటి జోలికి పోకూడదు. – ఎమర్సన్.","విజ్ఞానం అన్నింటినీ మించిన శక్తి. – శిసిరో.","వివేకవంతులు నిత్యం నేర్చుకుంటూనే ఉంటారు. – జాన్రస్కిన్.","ఉన్నతమైన వ్యక్తిత్వం ఉంటే శత్రువుకూడా నిన్ను చూసి తలదించుకుంటాడు – ఐన్స్టీన్.","నిజాయితీగలవారు తమ అంతరాత్మ ఒప్పుకోని పని చేయలేదు – హోమ్.","లక్ష్యాన్ని చేరుకోవాలంటే నిరంతరం ముందుకు పయనించాలి. – బాలగంగాధర్ తిలక్.","పని విచారాన్ని తగ్గిస్తుంది. – సిసిరో.","స్వయం కృషితో ఎదిగిన వ్యక్తి ఆదృష్టాన్ని నమ్మడు. – ఇబి వైట్.","ఒకసారి మోసం చేసినవారిని మరోసారి నమ్మకూడదు. – షేక్స్పియర్.","చేసిన తప్పులు ఎప్పటికైనా బయటపడతాయి. – డ్రైడెన్.","కల్మషంలేని నవ్వే ఉత్తమ ఔషధం. – సిసిరో.","అభ్యాసం ద్వారానే జ్ఞానం వస్తుంది. – కుమిళ్ధి [పేరు స్పష్టంగా లేదు]","ఎవరి విధికి వారే విధాత అని తెలుసుకోవాలి. – స్వామి వివేకానంద.","సంతోషాన్ని ఇచ్చేది సంపద కాదు ప్రశాంతమైన మనసు. – థామస్ జెఫర్సన్.","బాధ్యత తెలియనివారు ఏపనీ సక్రమంగా చేయలేరు. – సర్వేపల్లి రాధాకృష్ణన్.","ఏమీ తెలియని వారు తమకు అన్నీ తెలుసని భ్రమపడతారు. – ఎపిక్టేలస్.","తన ఉపన్యాసాలలో ప్రాసను ఉపయోగించి ప్రజలను ఆకట్టుకునే మన ఉపరాష్ట్రపతి శ్రీ యం. వెంకయ్యనాయుడు గారు మన తెలుగు వారే","అసూయలేని వాళ్ళు ఎల్లప్పుడూ సంతోషంగా ఉంటారు. – మోక్షగుండం విశ్వేశ్వరయ్య.","వ్యక్తి పతనానికి కారణం భయమే. – వివేకానంద.","మనం మాట్లాడే ప్రతి మాటా ప్రేమగా ఉండాలి. – మదర్ థెరిసా.","ఆడంబరాలు లేని వ్యక్తికి పెద్దగా సమస్యలు కూడా ఉండవు. – గాంధీజీ.","ఎప్పుడూ ఉన్నతమైన ఆలోచనలతోనే జీవించాలి. – స్వామీ వివేకానంద.","ఒక వ్యక్తిని సంతోషంగా ఉన్నపుడు పలకరించక పోయినా పరవాలేదు, బాధలో ఉన్నపుడు మాత్రం ఓదార్చాలి – బైబిల్.","మీలో ఉత్సాహం ఉంటే ఏదైనా సాధించగలరు – అబ్రహాం లింకన్.","తక్కువ మాట్లాడాలి, ఎక్కువగా వినాలి.","చీకట్లోనే నక్షత్రాలు కనిపించినట్లు కష్టాల్లోనే మంచితనం బయటపడుతుంది – శంకరాచార్య.","మనకు దురదృష్టాన్ని కలిగించేది మనం వృధా చేసిన కాలమే – లింకన్.","అజ్ఞానం కన్నా నిర్లక్ష్యమే ఎక్కువ కీడు చేస్తుంది – ఫ్రాంక్లిన్.","విద్య నీడలాంటిది, దానిని మన నుంచి ఎవరూ వేరు చేయలేరు – షేక్ స్పియర్.","మనలోని లోపాలు ఎత్తి చూపేవాడు నిజమైన మిత్రుడు – ఎమర్సన్.","అపజయాలు తప్పులు కావు, అవి భవిష్యత్తుకు పాఠాలు – ఏ.పి.జె. అబ్దుల్ కలాం.","విజయానికి అన్నింటికన్నా ముఖ్యమైనది ఆత్మవిశ్వాసం – విలియం హోడ్లే.","క్షమించడం వివేకవంతుల లక్షణం – గాంధీజీ.","మనం కోరుకున్నది లభించనప్పుడు మనకు లభించిన దాన్నే ఇష్టపడాలి – అరిస్టాటిల్.","మాటల్లో నింపాదిగా ఉండు, చూపులో మాత్రం వేగంగా ఉండాలి. – పికాసో.","అవసరం అనేది ఎటువంటి మూర్ఖున్ని అయినా వివేకవంతుణ్ని చేస్తుంది. – యూరోపిడిస్.","చెప్పటం కంటే, చేసి చూపటం మేలు – ఎమర్సన్.","ధైర్యసాహసాలు మనిషి విజయసాధనకు సోపానాలు – గోథే.","వేయి మంది మతాచార్యుల కన్నా ఒక మంచి ఉపాధ్యాయుడు విలువైన వాడు. – ఇంగర్ సోల్.","ఇతరులను ఆజ్ఞాపించే ముందు మీరు విధేయతగా ఉండడం నేర్చుకోండి. – సొలాన్.","వివేకవంతులు కాలాన్ని, జ్ఞానాన్ని సరిగ్గా ఉపయోగించుకొంటారు. – థామస్ జె. వాట్సన్.","సంతోషంతో తృప్తిగా జీవించే మనిషికి సహజమైన సిరిసంపదలు లభించినట్లే – సోక్రటీసు.","చెడు స్నేహాలు మీలో ఉన్న మంచి లక్షణాలను చెడగొడతాయ్ – బైబిల్.","తెలుగు భాష పదాలలో “ణ, ళ” అక్షరాలతో మొదలయ్యే పదాలు అరుదు.","నిన్నెవరూ ఇష్టపడడం లేదంటే అది కచ్చితంగా నీ తప్పే – డా. [పేరు స్పష్టంగా లేదు]","విలువలతో బతికిన వారే జీవితంలో అసలైన విజేతలు – రమణమహర్షి.","దూరదృష్టి ఉన్నవారు అనుకున్న పనుల్ని తప్పకుండా పూర్తి చేస్తారు – ఉడ్రో విల్సన్.","పరిపూర్ణత ఆచరణనుంచి మాత్రమే వస్తుంది – ముల్కరాజ్ ఆనంద్.","గెలవగలనన్న నమ్మకం ఉంటే తప్పక విజయం సాధిస్తారు – జాన్ డ్రైడెన్.","తక్కువ సంపాదించేవారికన్నా తక్కువ పొదుపు చేసేవారికే ఆర్థిక సమస్యలు వస్తాయి – గాంధీజీ.","నిన్ను చూసి చప్పట్లు కొట్టే పదివేళ్ళ కన్నా, కన్నీరు తుడిచే ఒక వేలు మిన్న – బైబిల్.","ఆత్మవిశ్వాసం సడలితే ఓటమి ప్రారంభమైనట్లే, అది వదలకుండా ఉన్నపుడు మాత్రం మనల్ని విజయం వరిస్తుంది – అబ్దుల్ కలాం.","సమయానికి కొలమానం సంవత్సరాలు గడిచిపోవడం కాదు… ఆ కాలంలో మనం ఏం చేశాం, ఎలా ఉన్నాం, ఏం సాధించామన్నది ముఖ్యం – జవహర్లాల్ నెహ్రూ.","ఒకరికొకరు పంచుకోవడంలోనే గొప్ప ఆనందం ఉంది – గౌతమ బుద్ధుడు.","ఉపాధ్యాయుడు విద్యార్థులకు నాణ్యమైన విద్య అందించాలంటే తాను నిరంతరం నేర్చుకోవాలి – ఠాగూర్.","ఇతరుల్ని మాటలతో గాయపరచి తాము బలవంతులమని నిరూపించుకునే ప్రయత్నం చేసేవారు మానసికంగా అందరికంటే బలహీనులు – మాథ్యూ ఆర్నాల్డ్.","విజయం మనల్ని ఊరికే వరించదు, దాని వెనుక ఎంతో కృషి, పట్టుదల, త్యాగం దాగుంటాయి – పీలే.","నీకు సాయం చేసినవారిని ఎప్పటికీ మరిచిపోవద్దు – భగవద్గీత.","ప్రశాంతమైన మనసుతో ఉండేవారికి ఏ పనైనా అయోమయంగా అనిపించదు – ఎపిక్టీటస్.","గతాన్ని తలచడం మానుకో, భవిష్యత్తు గురించి కలలు కనకు, ప్రస్తుతంపై మనసు లగ్నం చెయ్యి – గౌతమబుద్ధుడు.","పని ఏదైనా అనుభవ పూర్వకంగానే అందులో పట్టు సాధిస్తాం – అరిస్టాటిల్.","లేని గొప్పతనాన్ని ప్రదర్శిస్తే నీలో ఉన్న నిజమైన గొప్పతనం మరుగున పడుతుంది. – గౌతమ బుద్ధుడు.","జీవితంలో కోట్లు సంపాదించినా కలగని ఆనందం ఒక మంచి మిత్రుడు దొరికినపుడు కలుగుతుంది – సర్వేపల్లి రాధాకృష్ణన్.","మనిషి ఔన్నత్యానికి కొలమానం మేధస్సు కాదు, హృదయం – మదర్ థెరిసా.","విద్య అనే వృక్షంలో వేళ్ళు చేదుగా అనిపించవచ్చు, కానీ అది అందించే ఫలాలు చాలా మధురం – అరిస్టాటిల్.","ఏ పనినైనా ప్రేమతో చేసి చూడండి, అది మీ జీవితాన్ని సంతోష పరుస్తుంది – మదర్ థెరిసా.","పెద్దపని అసంపూర్తిగా చేసేబదులు చిన్నపని పూర్తిగా చేయడం ఉత్తమం – మోక్షగుండం విశ్వేశ్వరయ్య.","మనం మనకోసం చేసేది మనతోనే అంతరించిపోతుంది, ఇతరులకోసం చేసేది శాశ్వతంగా నిలిచి పోతుంది – మహాత్మ గాంధీజీ.","మీరు ఎలా ఆలోచిస్తే అలాగే తయారవుతారు. బలహీనులమని అనుకుంటే బలహీనులు, బలవంతులం అనుకుంటే బలవంతులవుతారు – స్వామి వివేకానంద.","మౌనం అత్యంత శక్తివంతమైన ప్రసంగం, అయితే అది ప్రపంచానికి నిదానంగా వినబడుతుంది – గాంధీజీ.","ఆశావాది తన శ్రమలో అవకాశాన్ని వెతుక్కుంటాడు, నిరాశావాది తనకొచ్చిన అవకాశాల్లోనూ శ్రమే ఉందనుకుంటాడు – జాన్సన్.","మనకున్నదానితో సంతృప్తిపడటం ఉత్తమమే కానీ, మనకున్న జ్ఞానం చాలనుకోవడం అజ్ఞానం – సర్వేపల్లి రాధాకృష్ణన్.","మందలో ఒకరుగా ఉండకు, వందలో ఒకరుగా ఉండడానికి ప్రయత్నించు – స్వామీ వివేకానంద.","అభ్యర్థి ఏ పార్టీవాడనికాదు, ఏ పాటివాడో చూడు; ఎన్నుకుంటే వెలగ బెట్టడం కాదు, ఇప్పటి వరకు ఏం చేశాడో చూడు; పెట్టుకునే టోపీ కాదు, పెట్టిన టోపీ చూడు – కాళోజీ.","ప్రపంచాన్ని మార్చగల శక్తివంతమైన ఆయుధం చదువొక్కటే – నెల్సన్ మండేలా.","నీవు నిజంగా జీవితాన్ని ప్రేమిస్తుంటే సమయాన్ని వృథా చెయ్యొద్దు, ఎందుకంటే జీవితాన్ని నిర్దేశించేది సమయమే – బ్రూస్లీ.","అణుకువ లేకపోతే అందంకూడా నికారంగా కనిపిస్తుంది – చాణక్యుడు.","ఒక వ్యక్తి గుణగణాలు పరీక్షించాలంటే అతనికి అధికారం ఇచ్చి చూడాలి – అబ్రహాం లింకన్.","మౌనంగా ఉండవలసిన సమయంలో మాట్లాడటం, మాట్లాడవలసిన సమయంలో మౌనంగా ఉండటం రెండూ నేరమే.","సరైన కారణాలే దృఢమైన పనులకు దారి తీస్తాయి – షేక్స్పియర్."]]]}]];
