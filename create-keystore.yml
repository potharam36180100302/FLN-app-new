name: Create signing keystore (run ONCE)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Keystore password (at least 6 characters)"
        required: true
      alias:
        description: "Key alias"
        required: true
        default: fln

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias "${{ inputs.alias }}" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.store_password }}" -keypass "${{ inputs.store_password }}" \
            -dname "CN=FLN Learning App, OU=MPPS Potharam, O=MPPS Potharam, L=Siddipet, ST=Telangana, C=IN"
          base64 -w0 release.jks > keystore_base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            release.jks
            keystore_base64.txt
          retention-days: 1
